[metadata]
name = codex-context-reminder
version = 0.1.0
description = Local-only Codex context monitor with handoff reminders.
long_description = file: README.md
long_description_content_type = text/markdown
license = MIT
author = Codex Context Reminder contributors
url = https://github.com/libenli222/codex-context-reminder
project_urls =
    Issues = https://github.com/libenli222/codex-context-reminder/issues
keywords = codex, context, tokens, handoff, cli
classifiers =
    Development Status :: 3 - Alpha
    Environment :: Console
    Intended Audience :: Developers
    License :: OSI Approved :: MIT License
    Operating System :: MacOS
    Programming Language :: Python :: 3
    Programming Language :: Python :: 3.9
    Programming Language :: Python :: 3.10
    Programming Language :: Python :: 3.11
    Programming Language :: Python :: 3.12
    Topic :: Software Development
    Topic :: Utilities

[options]
packages = find:
python_requires = >=3.9
include_package_data = True

[options.entry_points]
console_scripts =
    codex-context-reminder = codex_context_reminder.cli:main
